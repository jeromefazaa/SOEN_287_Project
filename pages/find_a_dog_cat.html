<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find A Dog/Cat</title>
    <link rel="stylesheet" href="../style.css">
    <!-- Bootstrap 5 CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>

<body>

    <section class="header">
        <h1>Pethouse</h1>
        <a href="./index.html"><img src="../images/monoline-pet-house-logo-animal-store-logo-design-vector.jpg"
                alt="Logo Picture. Not my image. Credits go to https://www.vecteezy.com/vector-art/7462231-monoline-pet-house-logo-animal-store-logo-design"></a>

    </section>

    <div class="side_menu_content_area">
        <section class="side_menu">
            <h5>Quick Links</h5>
            <a href="./index.html">Home</a>
            <a href="./pets.html">Browse Available Pets</a>
            <a href="./find_a_dog_cat.html">Find a dog/cat</a>
            <a href="./dog_care.html">Dog Care</a>
            <a href="./cat_care.html">Cat Care</a>
            <a href="./pet_giveaway.html">Have a pet to giveaway</a>
            <a href="./contact_us.html">Contact us</a>
        </section>


        <section class="content_area" id="home_page_content_area">

            <div class="content_area_title">
                <h2 class="content_area_title_header">Find A Specific Dog Or Cat</h2>
                <p class="content_area_title_description">Fill out the form below to filter your search for adoption</p>
            </div>

            <div class="content_area_content">
                <p>Finder Form</p>
                <form action="no_action_yet.com" id="find_pet_form">
                    <label>Animal Type</label>
                    <input type="radio" name="type" id="type_dog" value="dog">
                    <label for="type_dog">Dog</label>
                    <input type="radio" name="type" id="type_cat" value="cat">
                    <label for="type_dog">Cat</label>
                    <br>

                    <label for="pet_breed">Breed of cat or dog</label>
                    <input list="breed" id="pet_breed" name="pet_breed">

                    <datalist id="breed">
                        <option value="Doesn't Matter"></option>
                    </datalist>

                    <br>
                    <label for="age">Prefered Age</label>
                    <input type="number" name="age" id="age" min="0">
                    <br>

                    <label for="gender">Gender</label>
                    <select name="gender" id="gender">
                        <option value="">Select</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="either">Doesn't Matter</option>
                    </select>
                    <br>

                    <label>Would you prefer it gets along with?</label>
                    <label>
                        <input type="checkbox" name="get_along_with" value="children">Children
                    </label>
                    <label>
                        <input type="checkbox" name="get_along_with" value="dogd">Other Dogs
                    </label>

                    <label>
                        <input type="checkbox" name="get_along_with" value="cats">Other Cats
                    </label>
                    <br>
                    <input type="submit" value="Submit" id="form_submit_button">
                    <input type="reset" value="Reset">

                </form>

            </div>
        </section>


    </div>
    <section class="footer">
        <h6>Privacy Disclaimer:</h6>
        <a href="./privacy_disclaimer.html">Please Consult Our Privacy Disclaimer</a>
    </section>

    <script src="./scrip.js"></script>

</body>

</html>
